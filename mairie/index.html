<style>
  :root{--creme:#F6ECDD;--brun:#4E3222;--brun-doux:#85644E;--or1:#8F6620;--or2:#D9B65F;--or3:#F2DFA3}
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100vh;color:var(--brun);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    background:
      radial-gradient(520px 380px at 0% 0%,rgba(229,138,82,.22),transparent 70%),
      radial-gradient(480px 360px at 100% 38%,rgba(229,138,82,.16),transparent 70%),
      radial-gradient(520px 380px at 0% 100%,rgba(229,138,82,.18),transparent 70%),
      var(--creme);
  }
  .wrap{max-width:520px;margin:0 auto;padding:26px 16px 52px}
  .carte{
    border-radius:6px;overflow:hidden;background:#fff;
    box-shadow:0 0 0 1px rgba(143,102,32,.35),0 22px 50px rgba(78,50,34,.28);
    animation:monte .9s cubic-bezier(.2,.7,.1,1) both;
  }
  .carte img{display:block;width:100%;height:auto}
  @keyframes monte{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

  dl{margin:30px 0 0;border-top:1px solid rgba(143,102,32,.4)}
  dl div{display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:baseline;padding:15px 2px;border-bottom:1px solid rgba(143,102,32,.4)}
  dt{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--or1)}
  dd{font-size:19px;line-height:1.35}
  dd small{display:block;font-size:15px;color:var(--brun-doux);margin-top:2px}

  .precision{margin-top:18px;text-align:center;font-size:15px;line-height:1.5;font-style:italic;color:var(--brun-doux)}

  .actions{display:grid;gap:11px;margin-top:24px}
  .btn{
    appearance:none;display:flex;align-items:center;justify-content:center;gap:9px;text-decoration:none;cursor:pointer;
    font:inherit;font-size:16.5px;min-height:50px;padding:12px 20px;border-radius:999px;border:1.5px solid var(--or1);color:var(--brun);background:transparent;
    transition:transform .15s;
  }
  .btn:active{transform:scale(.985)}
  .btn svg{width:19px;height:19px;flex:none}
  .btn:focus-visible{outline:2px solid var(--brun);outline-offset:3px}

  .fin{text-align:center;margin-top:34px;font-style:italic;font-size:17px;color:var(--brun-doux)}
  .fin b{display:block;margin-top:6px;font-weight:400;font-size:24px;
    background:linear-gradient(100deg,var(--or1),var(--or2) 50%,var(--or1));-webkit-background-clip:text;background-clip:text;color:transparent}
  @media (prefers-reduced-motion:reduce){.carte{animation:none}.btn{transition:none}}

  .ev{margin-top:30px}
  .ev h2{font-weight:400;font-style:italic;font-size:25px;text-align:center;margin-bottom:14px;line-height:1.2}
  .ev dl{margin-top:0}
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  .duo .btn{min-height:46px;font-size:15.5px;padding:10px 12px;gap:7px}
  .duo .btn svg{width:17px;height:17px}
</style>
